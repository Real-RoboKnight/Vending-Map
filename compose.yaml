services:
  frontend:
    image: nginx:alpine
    ports:
      - "8079:80"
    container_name: frontend
    restart: unless-stopped
  
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:80"
    container_name: backend
    secrets:
      - db_password
    restart: unless-stopped
      
secrets:
  db_password:
    file: ./database_url.txt
