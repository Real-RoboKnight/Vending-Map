services:
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    container_name: frontend
    restart: unless-stopped
  
  backend:
    build: ./backend
    ports:
      - "8080:80"
    container_name: backend
    secrets:
      - db_password
    restart: unless-stopped
      
secrets:
  db_password:
    file: ./database_url.txt
