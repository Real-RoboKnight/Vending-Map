    <div id="map" style="height: 80vh"></div>
    <script type="module">
        import { LeafletMap, TileLayer, Marker, Circle } from 'leaflet';

        const map = new LeafletMap('map').setView([33.419, -111.932], 13);
        //https://tile.openstreetmap.org/{z}/{x}/{y}.png
        //&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>
        new TileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 23,
            referrerPolicy: 'strict-origin-when-cross-origin',
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
        }).addTo(map);





        //fetch data from backend
        let data = await (await fetch("http://45.63.89.239:8080/locations/?min_longitude=-200&min_latitude=-200&max_longitude=200&max_latitude=200")).json();
        
        //hardcoded test data
        //let data = JSON.parse(`[{"_id": "abc", "name": "NAME", "longitude": -111.932, "latitude": 33.419, "cash": true, "tap": false, "mng": false}]`)
        
        data.forEach((item) => {
            let popUpText = "";
            new Marker([item.latitude, item.longitude]).addTo(map).bindPopup(`<h3>${item.name}</h3><p>Cash: ${item.cash}</p><p>Tap: ${item.tap}</p><p>M&G: ${item.mng}</p><p><a href="/machine-info.html?machine_id=${item._id}">More info</a></p><p><a href="geo:${item.latitude},${item.longitude}">Open in Default Map App</a></p>`);
        
        })
        
        /*const circle = new Circle([33.419, -111.932], {

        }).addTo(map);*/

    </script>
