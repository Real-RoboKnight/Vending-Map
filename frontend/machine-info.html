    <div id="map" style="height: 400px"></div>
    <script type="module">
        import { LeafletMap, TileLayer, Marker, Circle } from 'leaflet';

        let numItems;

        let query_params = new URL(window.location.toString()).searchParams;

        let machine_id = query_params.get("machine_id");

        let data;
        if (machine_id) {
            data = await (await fetch(`http://45.63.89.239:8080/locations/${machine_id}`)).json();

            document.getElementById("_id").value = data._id;
            document.getElementById("name").value = data.name;
            document.getElementById("longitude").value = data.longitude;
            document.getElementById("latitude").value = data.latitude;
            document.getElementById("cash").value = data.cash;
            document.getElementById("tap").value = data.tap;
            document.getElementById("mandg").value = data.mng;

            numItems = data.items.length;

            let machine_items = document.getElementById("machine_items");
            for (let i = 0; i < numItems; i++) {

                //create item name input
                let newDiv = document.createElement("div");
                newDiv.classList.add("row");
                let newCol1Div = document.createElement("div");
                newCol1Div.classList.add("col");
                let newCol2Div = document.createElement("div");
                newCol2Div.classList.add("col");

                let newLabel1 = document.createElement("label");
                newLabel1.htmlFor = `item-${i}-name`;
                newLabel1.innerText = `Name of item #${i}`;
                newCol1Div.appendChild(newLabel1);

                let newInput2 = document.createElement("input");
                newInput2.type = "text";
                newInput2.id = `item-${i}-name`;
                newInput2.name = `item-${i}-name`;
                newInput2.value = data.items[i].name;

                newCol2Div.append(newInput2);

                newDiv.appendChild(newCol1Div);
                newDiv.appendChild(newCol2Div);
                machine_items.appendChild(newDiv);

                //now item price input
                newDiv = document.createElement("div");
                newDiv.classList.add("row");
                newCol1Div = document.createElement("div");
                newCol1Div.classList.add("col");
                newCol2Div = document.createElement("div");
                newCol2Div.classList.add("col");

                newLabel1 = document.createElement("label");
                newLabel1.htmlFor = `item-${i}-price`;
                newLabel1.innerText = `Price of item #${i}`;
                newCol1Div.appendChild(newLabel1);

                newInput2 = document.createElement("input");
                newInput2.type = "text";
                newInput2.id = `item-${i}-price`;
                newInput2.name = `item-${i}-price`;
                newInput2.value = data.items[i].price;

                newCol2Div.append(newInput2);

                newDiv.appendChild(newCol1Div);
                newDiv.appendChild(newCol2Div);
                machine_items.appendChild(newDiv);


            }




        }
        else {
            //window.location.href = "/map";

        }

        /*const circle = new Circle([33.419, -111.932], {

        function addItemRow() {
            console.log("adding row");

            let i = data.items.length;

            //create item name input
            let newDiv = document.createElement("div");
            newDiv.classList.add("row");
            let newCol1Div = document.createElement("div");
            newCol1Div.classList.add("col");
            let newCol2Div = document.createElement("div");
            newCol2Div.classList.add("col");

            let newLabel1 = document.createElement("label");
            newLabel1.htmlFor = `item-${i}-name`;
            newLabel1.innerText = `Name of item #${i}`;
            newCol1Div.appendChild(newLabel1);

            let newInput2 = document.createElement("input");
            newInput2.type = "text";
            newInput2.id = `item-${i}-name`;
            newInput2.name = `item-${i}-name`;

            newCol2Div.append(newInput2);

            newDiv.appendChild(newCol1Div);
            newDiv.appendChild(newCol2Div);
            machine_items.appendChild(newDiv);

            //now item price input
            newDiv = document.createElement("div");
            newDiv.classList.add("row");
            newCol1Div = document.createElement("div");
            newCol1Div.classList.add("col");
            newCol2Div = document.createElement("div");
            newCol2Div.classList.add("col");

            newLabel1 = document.createElement("label");
            newLabel1.htmlFor = `item-${i}-price`;
            newLabel1.innerText = `Price of item ${i}`;
            newCol1Div.appendChild(newLabel1);

            newInput2 = document.createElement("input");
            newInput2.type = "text";
            newInput2.id = `item-${i}-price`;
            newInput2.name = `item-${i}-price`;

            newCol2Div.append(newInput2);

            newDiv.appendChild(newCol1Div);
            newDiv.appendChild(newCol2Div);
            machine_items.appendChild(newDiv);

            console.log("done adding row");
        }
        document.getElementById("add-new-items-button").addEventListener("click", addItemRow);

        async function submitChanges() {
            let machineID = document.getElementById("_id").value;
            let name = document.getElementById("name").value;
            let latitude = Number(document.getElementById("latitude").value);
            let longitude = Number( document.getElementById("longitude").value);
            let cash = Boolean(document.getElementById("cash").value);
            let tap = Boolean(document.getElementById("tap").value);
            let mAndg = Boolean(document.getElementById("mandg").value);

            let items = []
            for (let i = 0; i < numItems; i++) {
                let newItem = {
                    "name": document.getElementById(`item-${i}-name`).value,
                    "price": Number(document.getElementById(`item-${i}-price`).value)
                };
                console.log(newItem);
                items.push(
                    newItem
                );
            }
            
            await fetch("http://45.63.89.239:8080/locations", {
                method: "PUT", body: JSON.stringify(

                    {
                        "_id": machineID,
                        "name": name,
                        "longitude": longitude,
                        "latitude": latitude,
                        "cash": cash,
                        "tap": tap,
                        "mng": mAndg,
                        "items": items
                    }
                )
            })
        }
        document.getElementById("submit-changes-button").addEventListener("click", submitChanges);
        document.getElementById("form").addEventListener("click", (e) => {
            e.preventDefault();
        });
    </script>
